<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Balance due</title>
    <base href="/" />
    <!-- PWA / iOS status bar / theme color -->
    <!-- theme-color will be updated dynamically according to light/dark mode -->
    <meta name="theme-color" content="#667eea" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- values: default | black | black-translucent. 'black-translucent' allows content
         to be rendered under the system bar (use env(safe-area-inset-top) to compensate) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- viewport-fit=cover is essential to support the safe-area / notch on iOS PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
